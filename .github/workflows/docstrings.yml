name: Docs Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: './.github/actions/cicd-setup'
      - name: Check docstring coverage
        run: interrogate --fail-under 95 freegsnke/