name: Notebook Outputs Check

on:
  pull_request:
    branches:
      - main

jobs:
  notebook-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: './.github/actions/cicd-setup'
      - name: Check notebooks have no cell outputs
        run: find examples -name '*.ipynb' -print0 | xargs -0 nbstripout --verify
