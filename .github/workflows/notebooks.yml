name: Notebooks Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  notebooks:
    strategy:
      fail-fast: false
    timeout-minutes: 60
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready-for-final-tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-for-final-tests')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: './.github/actions/cicd-setup'
      - name: Check build tokamak machine notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example00 - build_tokamak_machine.ipynb"
      - name: Check static inverse solve MAST-U notebook (1a)
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example01a - static_inverse_solve_MASTU"
      - name: Check static inverse solve MAST-U notebook (1b)
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example01b - advanced_static_inverse_solve"
      - name: Check static forward solve MAST-U notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example02 - static_forward_solve_MASTU.ipynb"
      - name: Check extracting equilibrium quantities notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example03a - extracting_equilibrium_quantities.ipynb"
      - name: Check using magnetic probes notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example04 - using_magnetic_probes.ipynb"
      - name: Check evolutive forward solve notebook (5a)
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05a - nonlinear_and_linear_evolution_with_GS.ipynb"
      - name: Check evolutive forward solve notebook (5b)
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05b - linear_evolution_without_GS.ipynb"
      - name: Check evolutive forward solve notebook (5c)
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05c - linear_evolution_with_relinearisation.ipynb"
      - name: Check static inverse solve Anamak notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07a - Anamak"
      - name: Check static inverse solve SPARC notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07b - SPARC"
      - name: Check static inverse solve ITER notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07c - ITER"
      - name: Check virtual circuits MAST-U notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example09 - virtual_circuits_MASTU.ipynb"
      - name: Check growth rates notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example10 - growth_rates.ipynb"
      - name: Check pulse design tool notebook
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example11 - pulse_design_tool.ipynb"

  numerical-parity:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready-for-final-tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-for-final-tests')
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      NUMEXPR_MAX_THREADS: '32'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout validated standalone reference
        uses: actions/checkout@v4
        with:
          # Certified by end-to-end numerical checks before this cleanup.
          ref: 27d0fef0ac52bfa049d6d1cfe1dceaff5b2bf345
          path: reference
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated candidate and reference environments
        run: |
          python -m venv "$RUNNER_TEMP/candidate-env"
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip install -e './candidate[dev]'
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip freeze --exclude freegsnke > "$RUNNER_TEMP/numerical-requirements.txt"
          python -m venv "$RUNNER_TEMP/reference-env"
          "$RUNNER_TEMP/reference-env/bin/python" -m pip install -r "$RUNNER_TEMP/numerical-requirements.txt" -e './reference[dev]'
      - name: Execute all five reference notebooks with numerical checkpoints
        run: |
          "$RUNNER_TEMP/reference-env/bin/python" candidate/tools/migration_notebooks.py run \
            --repo reference --python "$RUNNER_TEMP/reference-env/bin/python" \
            --output "$RUNNER_TEMP/migration-validation/reference"
      - name: Execute all five candidate notebooks
        run: |
          "$RUNNER_TEMP/candidate-env/bin/python" candidate/tools/migration_notebooks.py run \
            --repo candidate --python "$RUNNER_TEMP/candidate-env/bin/python" \
            --output "$RUNNER_TEMP/migration-validation/candidate"
      - name: Require numerical precision agreement
        run: |
          "$RUNNER_TEMP/candidate-env/bin/python" candidate/tools/migration_notebooks.py compare \
            --reference "$RUNNER_TEMP/migration-validation/reference" \
            --candidate "$RUNNER_TEMP/migration-validation/candidate" \
            --report "$RUNNER_TEMP/migration-validation/comparison.json"
      - name: Retain executed notebooks, numerical arrays and comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-numerical-validation
          path: ${{ runner.temp }}/migration-validation
          retention-days: 30
