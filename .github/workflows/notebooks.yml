name: Notebooks Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  notebooks:
    strategy:
      fail-fast: false
    timeout-minutes: 60
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready-for-final-tests') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready-for-final-tests')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: './.github/actions/cicd-setup'
      - name: Check example00
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example00 - build_tokamak_machine.ipynb"
      - name: Check example01a
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example01a - static_inverse_solve_MASTU.ipynb"
      - name: Check example01b
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example01b - advanced_static_inverse_solve.ipynb"
      - name: Check example01c
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example01c - advanced_divertor_configurations.ipynb"
      - name: Check example02
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example02 - static_forward_solve_MASTU.ipynb"
      - name: Check example03a
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example03a - extracting_equilibrium_quantities.ipynb"
      - name: Check example04
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example04 - using_magnetic_probes.ipynb"
      - name: Check example05a
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05a - nonlinear_and_linear_evolution_with_GS.ipynb"
      - name: Check example05b
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05b - linear_evolution_without_GS.ipynb"
      - name: Check example05c
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example05c - linear_evolution_with_relinearisation.ipynb"
      - name: Check example07a
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07a - Anamak.ipynb"
      - name: Check example07b
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07b - SPARC.ipynb"
      - name: Check example07c
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07c - ITER.ipynb"
      - name: Check example07d
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07d - EAST.ipynb"
      - name: Check example07e
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07e - KSTAR.ipynb"
      - name: Check example07f
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example07f - DIII-D.ipynb"
      - name: Check example09
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example09 - virtual_circuits_MASTU.ipynb"
      - name: Check example10
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example10 - growth_rates.ipynb"
      - name: Check example11
        run: jupyter nbconvert --execute --to notebook --inplace "examples/example11 - pulse_design_tool.ipynb"